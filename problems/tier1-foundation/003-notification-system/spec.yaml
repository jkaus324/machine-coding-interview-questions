problem_id: "003-notification-system"

functions:
  - name: reset_service
    params: []
    returns: void

  - name: notify_event
    params:
      - { name: event,             type: string }
      - { name: userIds,           type: "list<string>" }
      - { name: subscribedChannels, type: "list<string>" }
    returns: void

  - name: notify_priority
    params:
      - { name: event,             type: string }
      - { name: priority,          type: string }
      - { name: userIds,           type: "list<string>" }
      - { name: subscribedChannels, type: "list<string>" }
      - { name: minPriority,       type: string }
    returns: void

  - name: notify_priority_level
    params:
      - { name: priority, type: string }
    returns: int

  # Delivery log — one entry per notification actually sent, in send order,
  # formatted "<channel>:<userId>". reset_service() clears it. This is what
  # makes fan-out and priority filtering observable to the tests.
  - name: get_sent_log
    params: []
    returns: "list<string>"

parts:
  1: { name: "Multi-channel fan-out", functions: [reset_service, notify_event, get_sent_log] }
  2: { name: "Priority filtering",    functions: [notify_priority, notify_priority_level, get_sent_log] }
